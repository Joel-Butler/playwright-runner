apiVersion: v1
kind: Namespace
metadata:
  name: playwright-tenant
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: tenant-quota, namespace: playwright-tenant}
spec:
  hard: {pods: "20", requests.memory: 40Gi, limits.memory: 40Gi, count/jobs.batch: "20", count/secrets: "40", count/configmaps: "40"}
---
apiVersion: v1
kind: LimitRange
metadata: {name: tenant-limits, namespace: playwright-tenant}
spec:
  limits:
  - type: Container
    default: {cpu: "2", memory: 2Gi}
    defaultRequest: {cpu: 100m, memory: 256Mi}
    max: {cpu: "4", memory: 2Gi}

