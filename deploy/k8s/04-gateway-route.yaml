apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: playwright-runner, namespace: playwright-tenant}
spec:
  parentRefs: [{name: defaultgateway, namespace: gateway, sectionName: https-on}]
  hostnames: [on.jhbutler.info]
  rules:
  - matches: [{path: {type: PathPrefix, value: /playwright-runner}}]
    filters: [{type: URLRewrite, urlRewrite: {path: {type: ReplacePrefixMatch, replacePrefixMatch: /}}}]
    backendRefs: [{name: playwright-backend, port: 8080}]

