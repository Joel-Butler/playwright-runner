apiVersion: v1
kind: ServiceAccount
metadata: {name: runner, namespace: playwright-tenant}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: backend, namespace: playwright-tenant}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: backend-runner-orchestrator, namespace: playwright-tenant}
rules:
- apiGroups: [""]
  resources: [secrets, configmaps]
  verbs: [create, get, delete]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [create, get, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: backend-runner-orchestrator, namespace: playwright-tenant}
subjects: [{kind: ServiceAccount, name: backend, namespace: playwright-tenant}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: backend-runner-orchestrator}

